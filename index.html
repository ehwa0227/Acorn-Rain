<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
  >

  <title>🐿️ 이화 다람쥐의 도토리 모으기</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 10px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow-x: hidden;

      font-family:
        "Pretendard",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        Arial,
        sans-serif;

      color: #55351f;

      background:
        linear-gradient(
          135deg,
          #fff7d5,
          #dcefcf
        );
    }

    button {
      font: inherit;
    }

    .game-wrapper {
      width: min(100%, 540px);
      padding: 15px;

      background: rgba(255, 255, 255, 0.96);
      border: 2px solid rgba(108, 74, 48, 0.13);
      border-radius: 24px;

      box-shadow:
        0 18px 48px rgba(57, 86, 44, 0.23);
    }

    h1 {
      margin: 2px 0 6px;

      text-align: center;
      color: #704527;

      font-size: clamp(1.45rem, 6vw, 2rem);
    }

    .description {
      margin: 0 0 14px;

      text-align: center;
      color: #80634d;

      font-size: 0.88rem;
      line-height: 1.55;
    }

    .difficulty-title {
      margin-bottom: 8px;

      text-align: center;
      font-size: 0.92rem;
      font-weight: 900;
    }

    .difficulty-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;

      margin-bottom: 12px;
    }

    .difficulty-button {
      min-width: 0;
      padding: 10px 4px;

      border: 2px solid #dbc6a8;
      border-radius: 13px;

      background: #fffaf0;
      color: #65452e;

      font-weight: 900;
      cursor: pointer;
    }

    .difficulty-button small {
      display: block;
      margin-top: 2px;

      font-size: 0.7rem;
      font-weight: 700;
    }

    .difficulty-button.selected {
      border-color: #4e8b42;
      background: #4e8b42;
      color: white;

      box-shadow:
        0 5px 13px rgba(78, 139, 66, 0.28);
    }

    .difficulty-button:disabled {
      cursor: default;
      opacity: 0.65;
    }

    .status-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;

      margin-bottom: 10px;
    }

    .status-card {
      min-width: 0;
      padding: 8px 3px;

      text-align: center;

      background: #fff8df;
      border: 1px solid #e6d5b5;
      border-radius: 12px;
    }

    .status-label {
      display: block;
      margin-bottom: 3px;

      color: #876c55;

      font-size: 0.68rem;
      font-weight: 800;
    }

    .status-value {
      display: block;

      font-size: 0.92rem;
      font-weight: 900;
    }

    .progress-heading {
      display: flex;
      justify-content: space-between;

      margin-bottom: 5px;

      font-size: 0.8rem;
      font-weight: 900;
    }

    .progress-bar {
      height: 13px;
      margin-bottom: 10px;

      overflow: hidden;

      background: #efe1c0;
      border: 1px solid #d8c18f;
      border-radius: 999px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          #62a550,
          #f1c84a,
          #d7853e
        );

      transition: width 0.18s;
    }

    .game-area {
      position: relative;

      width: 100%;
      height: min(62vh, 600px);
      min-height: 420px;

      overflow: hidden;
      touch-action: none;
      user-select: none;

      border: 3px solid #82aa70;
      border-radius: 22px;

      background:
        radial-gradient(
          circle at 16% 12%,
          rgba(255, 255, 255, 0.95) 0 6%,
          transparent 6.5%
        ),
        radial-gradient(
          circle at 29% 13%,
          rgba(255, 255, 255, 0.9) 0 9%,
          transparent 9.5%
        ),
        radial-gradient(
          circle at 81% 20%,
          rgba(255, 255, 255, 0.85) 0 8%,
          transparent 8.5%
        ),
        linear-gradient(
          180deg,
          #a8def8 0%,
          #eaf8ff 67%,
          #a0d177 67%,
          #73ad57 100%
        );
    }

    .sun {
      position: absolute;
      top: 22px;
      right: 27px;

      width: 48px;
      height: 48px;

      border-radius: 50%;
      background: #ffe477;

      box-shadow:
        0 0 25px rgba(255, 220, 95, 0.8);
    }

    .tree {
      position: absolute;
      bottom: 49px;

      width: 13px;
      height: 96px;

      border-radius: 8px;
      background: #755037;

      opacity: 0.75;
    }

    .tree::before {
      content: "";

      position: absolute;
      top: -35px;
      left: 50%;

      width: 70px;
      height: 70px;

      transform: translateX(-50%);

      border-radius: 50%;
      background: #4c9851;

      box-shadow:
        -27px 17px 0 #5aa65d,
        27px 16px 0 #438c49;
    }

    .tree-left {
      left: 29px;
    }

    .tree-right {
      right: 29px;
      transform: scale(0.87);
    }

    .ground {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;

      height: 54px;

      background:
        repeating-linear-gradient(
          90deg,
          #548c42 0 16px,
          #649c4c 16px 32px
        );

      border-top:
        3px solid rgba(64, 119, 53, 0.55);
    }

    .player {
      position: absolute;
      bottom: 25px;
      left: 50%;
      z-index: 15;

      width: 100px;
      height: 105px;

      transform: translateX(-50%);

      pointer-events: none;
    }

    .squirrel {
      position: absolute;
      right: 16px;
      bottom: 16px;

      font-size: 57px;
      line-height: 1;

      filter:
        drop-shadow(0 4px 2px rgba(0, 0, 0, 0.18));
    }

    .basket {
      position: absolute;
      bottom: 0;
      left: 2px;

      width: 96px;
      height: 37px;

      border: 4px solid #6b4028;
      border-radius: 8px 8px 24px 24px;

      background:
        repeating-linear-gradient(
          45deg,
          #bb784d 0 8px,
          #db9862 8px 16px
        );

      box-shadow:
        0 5px 7px rgba(75, 46, 27, 0.23);
    }

    .basket::before {
      content: "";

      position: absolute;
      top: -25px;
      left: 23px;

      width: 43px;
      height: 31px;

      border: 4px solid #6b4028;
      border-bottom: 0;
      border-radius: 28px 28px 0 0;
    }

    .player.hit {
      animation: player-hit 0.28s ease;
    }

    @keyframes player-hit {
      0% {
        filter: none;
      }

      50% {
        filter:
          drop-shadow(0 0 12px #e13030)
          saturate(2);
      }

      100% {
        filter: none;
      }
    }

    .falling-item {
      position: absolute;
      z-index: 10;

      display: flex;
      justify-content: center;
      align-items: center;

      width: 46px;
      height: 46px;

      pointer-events: none;
      will-change: top, transform;

      filter:
        drop-shadow(0 4px 3px rgba(0, 0, 0, 0.22));
    }

    .falling-item.acorn {
      animation:
        acorn-spin 1s linear infinite;
    }

    .falling-item.chestnut {
      font-size: 38px;

      animation:
        item-wobble 0.38s ease-in-out
        infinite alternate;
    }

    .falling-item.heart {
      z-index: 14;

      width: 56px;
      height: 56px;

      font-size: 47px;

      filter:
        drop-shadow(0 0 7px #ff5c88)
        drop-shadow(0 5px 3px rgba(0, 0, 0, 0.2));

      animation:
        heart-pulse 0.55s ease-in-out
        infinite alternate;
    }

    .acorn-image {
      display: block;

      width: 43px;
      height: 43px;

      object-fit: contain;
      pointer-events: none;
    }

    @keyframes acorn-spin {
      from {
        transform: rotate(-12deg);
      }

      to {
        transform: rotate(348deg);
      }
    }

    @keyframes item-wobble {
      from {
        transform: rotate(-14deg);
      }

      to {
        transform: rotate(14deg);
      }
    }

    @keyframes heart-pulse {
      from {
        transform: scale(0.88) rotate(-6deg);
      }

      to {
        transform: scale(1.18) rotate(6deg);
      }
    }

    .floating-score {
      position: absolute;
      z-index: 30;

      font-size: 1.3rem;
      font-weight: 900;

      pointer-events: none;

      animation:
        score-float 0.72s ease-out forwards;
    }

    .floating-score.plus {
      color: #237c31;
    }

    .floating-score.minus {
      color: #d83e3e;
    }

    .floating-score.love {
      color: #f02f6d;
      font-size: 1.5rem;
    }

    @keyframes score-float {
      0% {
        opacity: 1;
        transform:
          translateY(0)
          scale(0.85);
      }

      100% {
        opacity: 0;
        transform:
          translateY(-60px)
          scale(1.25);
      }
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 50;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 24px;

      text-align: center;

      background:
        rgba(255, 252, 238, 0.92);

      backdrop-filter: blur(4px);
    }

    .screen.hidden {
      display: none;
    }

    .screen-icon {
      margin-bottom: 7px;

      font-size: 4rem;
      line-height: 1;
    }

    .start-acorn {
      width: 80px;
      height: 80px;

      object-fit: contain;

      filter:
        drop-shadow(0 5px 4px rgba(0, 0, 0, 0.18));
    }

    .screen h2 {
      margin: 6px 0 11px;

      font-size: 1.7rem;
    }

    .screen p {
      margin: 4px 0;

      line-height: 1.55;
    }

    .heart-notice {
      margin-top: 10px !important;
      padding: 8px 13px;

      color: #c9275d;
      background: #ffe3ec;
      border-radius: 12px;

      font-weight: 900;
    }

    .primary-button {
      min-width: 180px;
      margin-top: 17px;
      padding: 13px 22px;

      border: 0;
      border-radius: 999px;

      color: white;
      background: #4b873f;

      font-size: 1rem;
      font-weight: 900;

      box-shadow:
        0 7px 16px rgba(75, 135, 63, 0.28);

      cursor: pointer;
    }

    .primary-button:active {
      transform: scale(0.97);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;

      margin-top: 12px;
    }

    .control-button {
      min-height: 55px;

      border: 0;
      border-radius: 15px;

      color: white;
      background: #86583a;

      font-size: 1.6rem;
      font-weight: 900;

      box-shadow:
        0 5px 10px rgba(91, 53, 37, 0.22);

      cursor: pointer;
      touch-action: manipulation;
    }

    .control-button.active,
    .control-button:active {
      background: #68402d;

      transform: translateY(2px);

      box-shadow:
        0 2px 5px rgba(91, 53, 37, 0.25);
    }

    .instructions {
      margin: 10px 0 0;

      text-align: center;
      color: #796052;

      font-size: 0.78rem;
      line-height: 1.5;
    }

    @media (max-width: 430px) {
      body {
        padding: 6px;
      }

      .game-wrapper {
        padding: 10px;
        border-radius: 19px;
      }

      .description {
        font-size: 0.81rem;
      }

      .game-area {
        height: 59vh;
        min-height: 410px;
      }

      .difficulty-button {
        padding: 8px 3px;
      }

      .status-value {
        font-size: 0.84rem;
      }
    }
  </style>
</head>

<body>

  <main class="game-wrapper">

    <h1>🐿️ 이화 다람쥐의 도토리 모으기</h1>

    <p class="description">
      도토리 50개를 바구니에 담으세요.<br>
      밤은 감점, 단 한 번 떨어지는 이화의 사랑은 최종 치트키!
    </p>

    <div class="difficulty-title">
      난이도 선택
    </div>

    <section class="difficulty-buttons">

      <button
        type="button"
        class="difficulty-button"
        data-difficulty="easy"
      >
        하
        <small>보통</small>
      </button>

      <button
        type="button"
        class="difficulty-button selected"
        data-difficulty="normal"
      >
        중
        <small>빠르게</small>
      </button>

      <button
        type="button"
        class="difficulty-button"
        data-difficulty="hard"
      >
        상
        <small>완전 빠르게</small>
      </button>

    </section>

    <section class="status-board">

      <div class="status-card">
        <span class="status-label">
          도토리 점수
        </span>

        <span
          class="status-value"
          id="scoreValue"
        >
          0 / 50
        </span>
      </div>

      <div class="status-card">
        <span class="status-label">
          난이도
        </span>

        <span
          class="status-value"
          id="difficultyValue"
        >
          중
        </span>
      </div>

      <div class="status-card">
        <span class="status-label">
          플레이 시간
        </span>

        <span
          class="status-value"
          id="timeValue"
        >
          0.0초
        </span>
      </div>

    </section>

    <div class="progress-heading">
      <span>목표 달성도</span>
      <span id="progressText">0%</span>
    </div>

    <div class="progress-bar">
      <div
        class="progress-fill"
        id="progressFill"
      ></div>
    </div>

    <section
      class="game-area"
      id="gameArea"
    >

      <div class="sun"></div>

      <div class="tree tree-left"></div>
      <div class="tree tree-right"></div>

      <div class="ground"></div>

      <div
        class="player"
        id="player"
      >
        <div class="squirrel">🐿️</div>
        <div class="basket"></div>
      </div>

      <div
        class="screen"
        id="startScreen"
      >

        🐿️

        <h2>내 사랑 도토리 50개 모으기</h2>

        <p>
          도토리를 받으면
          <strong>+1점</strong>
        </p>

        <p>
          밤을 받으면
          <strong>-1점</strong>
        </p>

        <p class="heart-notice">
          ❤️ 나의 사랑을 받으면 즉시 클리어!
        </p>

        <button
          type="button"
          class="primary-button"
          id="startButton"
        >
          게임 시작
        </button>

      </div>

      <div
        class="screen hidden"
        id="resultScreen"
      >

        <div
          class="screen-icon"
          id="resultIcon"
        >
          🎉🐿️🎉
        </div>

        <h2 id="resultTitle">
          도토리 50개 성공!
        </h2>

        <p id="resultMessage"></p>

        <p id="bestMessage"></p>

        <button
          type="button"
          class="primary-button"
          id="restartButton"
        >
          다시 도전하기
        </button>

      </div>

    </section>

    <section class="controls">

      <button
        type="button"
        class="control-button"
        id="leftButton"
        aria-label="왼쪽으로 이동"
      >
        ◀
      </button>

      <button
        type="button"
        class="control-button"
        id="rightButton"
        aria-label="오른쪽으로 이동"
      >
        ▶
      </button>

    </section>

    <p class="instructions">
      PC: ← → 또는 A/D 키<br>
      모바일: 좌우 버튼 또는 게임 화면 드래그
    </p>

  </main>

  <script>
    "use strict";

    const TARGET_SCORE = 50;

    const difficultySettings = {
      easy: {
        label: "하",
        description: "보통",
        minimumSpeed: 180,
        maximumSpeed: 250,
        spawnInterval: 590,
        chestnutChance: 0.25,
        heartSpeed: 205
      },

      normal: {
        label: "중",
        description: "빠르게",
        minimumSpeed: 285,
        maximumSpeed: 390,
        spawnInterval: 410,
        chestnutChance: 0.34,
        heartSpeed: 310
      },

      hard: {
        label: "상",
        description: "완전 빠르게",
        minimumSpeed: 425,
        maximumSpeed: 570,
        spawnInterval: 250,
        chestnutChance: 0.43,
        heartSpeed: 445
      }
    };

    const gameArea =
      document.getElementById("gameArea");

    const player =
      document.getElementById("player");

    const scoreValue =
      document.getElementById("scoreValue");

    const difficultyValue =
      document.getElementById(
        "difficultyValue"
      );

    const timeValue =
      document.getElementById("timeValue");

    const progressText =
      document.getElementById("progressText");

    const progressFill =
      document.getElementById("progressFill");

    const startScreen =
      document.getElementById("startScreen");

    const resultScreen =
      document.getElementById("resultScreen");

    const resultIcon =
      document.getElementById("resultIcon");

    const resultTitle =
      document.getElementById("resultTitle");

    const resultMessage =
      document.getElementById(
        "resultMessage"
      );

    const bestMessage =
      document.getElementById("bestMessage");

    const startButton =
      document.getElementById("startButton");

    const restartButton =
      document.getElementById(
        "restartButton"
      );

    const leftButton =
      document.getElementById("leftButton");

    const rightButton =
      document.getElementById("rightButton");

    const difficultyButtons =
      document.querySelectorAll(
        ".difficulty-button"
      );

    let selectedDifficulty = "normal";

    let gameRunning = false;
    let score = 0;

    let playerX = 0;
    let movementDirection = 0;

    let startTime = 0;
    let elapsedTime = 0;

    let previousFrameTime = 0;
    let previousSpawnTime = 0;

    let animationFrameId = null;

    let fallingItems = [];

    let dragging = false;

    let heartHasAppeared = false;
    let heartDropTime = 0;

    let clearedWithHeart = false;

    function updatePlayerPosition() {
      const maximumX =
        gameArea.clientWidth -
        player.offsetWidth;

      playerX = Math.max(
        0,
        Math.min(maximumX, playerX)
      );

      player.style.left = playerX + "px";
      player.style.transform = "none";
    }

    function centerPlayer() {
      playerX =
        (
          gameArea.clientWidth -
          player.offsetWidth
        ) / 2;

      updatePlayerPosition();
    }

    function updateStatus() {
      scoreValue.textContent =
        `${score} / ${TARGET_SCORE}`;

      const selected =
        difficultySettings[
          selectedDifficulty
        ];

      difficultyValue.textContent =
        selected.label +
        " · " +
        selected.description;

      timeValue.textContent =
        `${elapsedTime.toFixed(1)}초`;

      const percentage =
        Math.min(
          100,
          Math.round(
            (score / TARGET_SCORE) * 100
          )
        );

      progressText.textContent =
        percentage + "%";

      progressFill.style.width =
        percentage + "%";
    }

    function removeAllItems() {
      fallingItems.forEach((item) => {
        item.element.remove();
      });

      fallingItems = [];
    }

    function resetGame() {
      gameRunning = false;

      score = 0;
      elapsedTime = 0;

      movementDirection = 0;

      previousFrameTime = 0;
      previousSpawnTime = 0;

      heartHasAppeared = false;
      clearedWithHeart = false;

      /*
        하트는 게임 시작 후
        8초에서 18초 사이에 딱 한 번 등장
      */
      heartDropTime =
        8000 + Math.random() * 10000;

      if (animationFrameId !== null) {
        cancelAnimationFrame(
          animationFrameId
        );
      }

      animationFrameId = null;

      removeAllItems();
      centerPlayer();
      updateStatus();
    }

    function startGame() {
      resetGame();

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");

      difficultyButtons.forEach(
        (button) => {
          button.disabled = true;
        }
      );

      gameRunning = true;

      startTime = performance.now();

      previousFrameTime = startTime;
      previousSpawnTime = startTime;

      animationFrameId =
        requestAnimationFrame(gameLoop);
    }

    function endGame(
      heartClear = false
    ) {
      if (!gameRunning) {
        return;
      }

      gameRunning = false;
      movementDirection = 0;
      clearedWithHeart = heartClear;

      if (animationFrameId !== null) {
        cancelAnimationFrame(
          animationFrameId
        );
      }

      animationFrameId = null;

      removeAllItems();

      if (heartClear) {
        resultIcon.textContent = "❤️🐿️❤️";

        resultTitle.textContent =
          "하트 치트키 성공!";

        resultMessage.textContent =
          "최종 치트키를 획득하여 즉시 클리어했습니다!";

        bestMessage.textContent =
          `하트를 ${elapsedTime.toFixed(1)}초 만에 잡았어요.`;
      } else {
        resultIcon.textContent = "🎉🐿️🎉";

        resultTitle.textContent =
          "도토리 50개 성공!";

        resultMessage.textContent =
          `${elapsedTime.toFixed(1)}초 만에 목표를 달성했어요!`;

        updateBestRecord();
      }

      resultScreen.classList.remove(
        "hidden"
      );

      difficultyButtons.forEach(
        (button) => {
          button.disabled = false;
        }
      );
    }

    function updateBestRecord() {
      const storageKey =
        "acornGameBest_" +
        selectedDifficulty;

      const savedRecord =
        Number(
          localStorage.getItem(storageKey)
        );

      const isNewRecord =
        !savedRecord ||
        elapsedTime < savedRecord;

      if (isNewRecord) {
        localStorage.setItem(
          storageKey,
          elapsedTime.toString()
        );

        bestMessage.textContent =
          "🏆 새로운 최고 기록: " +
          elapsedTime.toFixed(1) +
          "초";
      } else {
        bestMessage.textContent =
          "최고 기록: " +
          savedRecord.toFixed(1) +
          "초";
      }
    }

    function createRegularItem() {
      const settings =
        difficultySettings[
          selectedDifficulty
        ];

      const isChestnut =
        Math.random() <
        settings.chestnutChance;

      const element =
        document.createElement("div");

      element.className =
        "falling-item " +
        (
          isChestnut
            ? "chestnut"
            : "acorn"
        );

      if (isChestnut) {
        element.textContent = "🌰";
      } else {
        const acornImage =
          document.createElement("img");

        acornImage.src = "./acorn.png";
        acornImage.alt = "도토리";
        acornImage.className =
          "acorn-image";

        element.appendChild(acornImage);
      }

      const itemSize = 46;

      const maximumX =
        gameArea.clientWidth -
        itemSize;

      const x =
        Math.random() * maximumX;

      const speed =
        settings.minimumSpeed +
        Math.random() *
        (
          settings.maximumSpeed -
          settings.minimumSpeed
        );

      element.style.left = x + "px";
      element.style.top = "-58px";

      gameArea.appendChild(element);

      fallingItems.push({
        element: element,

        kind:
          isChestnut
            ? "chestnut"
            : "acorn",

        x: x,
        y: -58,

        size: itemSize,
        speed: speed
      });
    }

    function createHeart() {
      if (heartHasAppeared) {
        return;
      }

      heartHasAppeared = true;

      const settings =
        difficultySettings[
          selectedDifficulty
        ];

      const element =
        document.createElement("div");

      element.className =
        "falling-item heart";

      element.textContent = "❤️";

      const itemSize = 56;

      const maximumX =
        gameArea.clientWidth -
        itemSize;

      const x =
        Math.random() * maximumX;

      element.style.left = x + "px";
      element.style.top = "-65px";

      gameArea.appendChild(element);

      fallingItems.push({
        element: element,
        kind: "heart",

        x: x,
        y: -65,

        size: itemSize,
        speed: settings.heartSpeed
      });
    }

    function rectanglesOverlap(
      first,
      second
    ) {
      return (
        first.left < second.right &&
        first.right > second.left &&
        first.top < second.bottom &&
        first.bottom > second.top
      );
    }

    function showScoreEffect(
      text,
      x,
      y,
      styleName
    ) {
      const effect =
        document.createElement("div");

      effect.className =
        "floating-score " +
        styleName;

      effect.textContent = text;
      effect.style.left = x + "px";
      effect.style.top = y + "px";

      gameArea.appendChild(effect);

      setTimeout(() => {
        effect.remove();
      }, 740);
    }

    function collectItem(item) {
      if (item.kind === "heart") {
        showScoreEffect(
          "치트키!",
          item.x,
          item.y,
          "love"
        );

        endGame(true);
        return;
      }

      if (item.kind === "acorn") {
        score += 1;

        showScoreEffect(
          "+1",
          item.x,
          item.y,
          "plus"
        );
      }

      if (item.kind === "chestnut") {
        score =
          Math.max(0, score - 1);

        showScoreEffect(
          "-1",
          item.x,
          item.y,
          "minus"
        );

        player.classList.remove("hit");

        void player.offsetWidth;

        player.classList.add("hit");

        setTimeout(() => {
          player.classList.remove("hit");
        }, 280);
      }

      updateStatus();

      if (score >= TARGET_SCORE) {
        endGame(false);
      }
    }

    function movePlayer(
      deltaSeconds
    ) {
      const playerSpeed = 390;

      playerX +=
        movementDirection *
        playerSpeed *
        deltaSeconds;

      updatePlayerPosition();
    }

    function moveFallingItems(
      deltaSeconds
    ) {
      const areaRectangle =
        gameArea.getBoundingClientRect();

      const playerRectangle =
        player.getBoundingClientRect();

      const basketRectangle = {
        left:
          playerRectangle.left + 2,

        right:
          playerRectangle.right - 2,

        top:
          playerRectangle.bottom - 45,

        bottom:
          playerRectangle.bottom - 2
      };

      for (
        let index =
          fallingItems.length - 1;

        index >= 0;

        index--
      ) {
        const item =
          fallingItems[index];

        item.y +=
          item.speed *
          deltaSeconds;

        item.element.style.top =
          item.y + "px";

        const itemRectangle = {
          left:
            areaRectangle.left +
            item.x +
            5,

          right:
            areaRectangle.left +
            item.x +
            item.size -
            5,

          top:
            areaRectangle.top +
            item.y +
            5,

          bottom:
            areaRectangle.top +
            item.y +
            item.size -
            4
        };

        if (
          rectanglesOverlap(
            itemRectangle,
            basketRectangle
          )
        ) {
          item.element.remove();

          fallingItems.splice(
            index,
            1
          );

          collectItem(item);

          if (!gameRunning) {
            return;
          }

          continue;
        }

        if (
          item.y >
          gameArea.clientHeight + 70
        ) {
          item.element.remove();

          fallingItems.splice(
            index,
            1
          );
        }
      }
    }

    function gameLoop(currentTime) {
      if (!gameRunning) {
        return;
      }

      const frameDifference =
        Math.min(
          34,
          currentTime -
          previousFrameTime
        );

      const deltaSeconds =
        frameDifference / 1000;

      previousFrameTime =
        currentTime;

      elapsedTime =
        (currentTime - startTime) /
        1000;

      const settings =
        difficultySettings[
          selectedDifficulty
        ];

      if (
        currentTime -
        previousSpawnTime >=
        settings.spawnInterval
      ) {
        createRegularItem();

        previousSpawnTime =
          currentTime;
      }

      const gameTimeMilliseconds =
        currentTime - startTime;

      if (
        !heartHasAppeared &&
        gameTimeMilliseconds >=
          heartDropTime
      ) {
        createHeart();
      }

      movePlayer(deltaSeconds);

      moveFallingItems(
        deltaSeconds
      );

      updateStatus();

      if (gameRunning) {
        animationFrameId =
          requestAnimationFrame(
            gameLoop
          );
      }
    }

    function selectDifficulty(
      difficulty
    ) {
      if (gameRunning) {
        return;
      }

      selectedDifficulty =
        difficulty;

      difficultyButtons.forEach(
        (button) => {
          button.classList.toggle(
            "selected",
            button.dataset.difficulty ===
              difficulty
          );
        }
      );

      updateStatus();
    }

    function beginMovement(
      direction,
      button
    ) {
      movementDirection = direction;

      button.classList.add(
        "active"
      );
    }

    function stopMovement(button) {
      movementDirection = 0;

      button.classList.remove(
        "active"
      );
    }

    function addMovementButton(
      button,
      direction
    ) {
      button.addEventListener(
        "pointerdown",
        (event) => {
          event.preventDefault();

          button.setPointerCapture(
            event.pointerId
          );

          beginMovement(
            direction,
            button
          );
        }
      );

      button.addEventListener(
        "pointerup",
        () => {
          stopMovement(button);
        }
      );

      button.addEventListener(
        "pointercancel",
        () => {
          stopMovement(button);
        }
      );

      button.addEventListener(
        "pointerleave",
        () => {
          stopMovement(button);
        }
      );
    }

    function movePlayerToPointer(
      event
    ) {
      const areaRectangle =
        gameArea.getBoundingClientRect();

      const pointerX =
        event.clientX -
        areaRectangle.left;

      playerX =
        pointerX -
        player.offsetWidth / 2;

      updatePlayerPosition();
    }

    difficultyButtons.forEach(
      (button) => {
        button.addEventListener(
          "click",
          () => {
            selectDifficulty(
              button.dataset.difficulty
            );
          }
        );
      }
    );

    startButton.addEventListener(
      "click",
      startGame
    );

    restartButton.addEventListener(
      "click",
      startGame
    );

    document.addEventListener(
      "keydown",
      (event) => {
        const key =
          event.key.toLowerCase();

        if (
          event.key === "ArrowLeft" ||
          key === "a"
        ) {
          event.preventDefault();

          movementDirection = -1;
        }

        if (
          event.key === "ArrowRight" ||
          key === "d"
        ) {
          event.preventDefault();

          movementDirection = 1;
        }

        if (
          event.key === " " &&
          !gameRunning
        ) {
          event.preventDefault();

          startGame();
        }
      }
    );

    document.addEventListener(
      "keyup",
      (event) => {
        const key =
          event.key.toLowerCase();

        if (
          event.key === "ArrowLeft" ||
          event.key === "ArrowRight" ||
          key === "a" ||
          key === "d"
        ) {
          movementDirection = 0;
        }
      }
    );

    addMovementButton(
      leftButton,
      -1
    );

    addMovementButton(
      rightButton,
      1
    );

    gameArea.addEventListener(
      "pointerdown",
      (event) => {
        if (!gameRunning) {
          return;
        }

        dragging = true;

        gameArea.setPointerCapture(
          event.pointerId
        );

        movePlayerToPointer(event);
      }
    );

    gameArea.addEventListener(
      "pointermove",
      (event) => {
        if (
          !gameRunning ||
          !dragging
        ) {
          return;
        }

        movePlayerToPointer(event);
      }
    );

    gameArea.addEventListener(
      "pointerup",
      () => {
        dragging = false;
      }
    );

    gameArea.addEventListener(
      "pointercancel",
      () => {
        dragging = false;
      }
    );

    window.addEventListener(
      "resize",
      updatePlayerPosition
    );

    resetGame();
  </script>

</body>
</html>
