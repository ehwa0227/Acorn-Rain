<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>다람쥐의 도토리 대작전</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;

      font-family:
        "Pretendard",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

      color: #54351f;

      background:
        linear-gradient(
          135deg,
          #fff8d8,
          #dff3ce
        );
    }

    button {
      font: inherit;
    }

    .game-container {
      width: min(100%, 520px);
      padding: 16px;

      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;

      box-shadow:
        0 18px 45px rgba(72, 97, 53, 0.22);
    }

    h1 {
      margin: 2px 0 6px;
      text-align: center;
      font-size: clamp(1.45rem, 6vw, 2rem);
      color: #704527;
    }

    .description {
      margin: 0 0 15px;
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.55;
      color: #80644f;
    }

    .difficulty-title {
      margin-bottom: 8px;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 800;
    }

    .difficulty-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 13px;
    }

    .difficulty-button {
      padding: 10px 5px;

      border: 2px solid #d8c4a6;
      border-radius: 13px;

      background: #fffaf0;
      color: #63422c;

      font-weight: 800;
      cursor: pointer;
    }

    .difficulty-button.selected {
      border-color: #4f8b43;
      background: #4f8b43;
      color: white;

      box-shadow:
        0 5px 12px rgba(79, 139, 67, 0.3);
    }

    .difficulty-button:disabled {
      cursor: default;
      opacity: 0.65;
    }

    .status-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }

    .status-card {
      min-width: 0;
      padding: 8px 4px;

      text-align: center;

      background: #fff8df;
      border: 1px solid #e5d4b5;
      border-radius: 12px;
    }

    .status-name {
      display: block;
      margin-bottom: 2px;

      color: #896e59;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .status-value {
      display: block;
      font-size: 0.95rem;
      font-weight: 900;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;

      font-size: 0.8rem;
      font-weight: 800;
    }

    .progress-bar {
      height: 13px;
      margin-bottom: 10px;
      overflow: hidden;

      background: #efe1bf;
      border: 1px solid #d8c18d;
      border-radius: 999px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          #69a953,
          #f2c94c,
          #d78a3d
        );

      transition: width 0.2s;
    }

    .game-area {
      position: relative;

      width: 100%;
      height: min(62vh, 590px);
      min-height: 410px;

      overflow: hidden;
      user-select: none;
      touch-action: none;

      border: 3px solid #82a96f;
      border-radius: 22px;

      background:
        radial-gradient(
          circle at 20% 12%,
          white 0 7%,
          transparent 7.5%
        ),
        radial-gradient(
          circle at 31% 13%,
          rgba(255, 255, 255, 0.9) 0 10%,
          transparent 10.5%
        ),
        radial-gradient(
          circle at 80% 21%,
          rgba(255, 255, 255, 0.85) 0 9%,
          transparent 9.5%
        ),
        linear-gradient(
          180deg,
          #a9ddf7 0%,
          #eaf8ff 67%,
          #9fd176 67%,
          #72ad57 100%
        );
    }

    .sun {
      position: absolute;
      top: 22px;
      right: 26px;

      width: 48px;
      height: 48px;

      border-radius: 50%;
      background: #ffe477;

      box-shadow:
        0 0 25px rgba(255, 221, 98, 0.75);
    }

    .tree {
      position: absolute;
      bottom: 48px;

      width: 13px;
      height: 96px;

      background: #755036;
      border-radius: 8px;

      opacity: 0.75;
    }

    .tree::before {
      content: "";

      position: absolute;
      top: -35px;
      left: 50%;

      width: 70px;
      height: 70px;

      transform: translateX(-50%);

      border-radius: 50%;
      background: #4c9851;

      box-shadow:
        -27px 17px 0 #5aa65d,
        27px 16px 0 #438c49;
    }

    .tree-left {
      left: 30px;
    }

    .tree-right {
      right: 28px;
      transform: scale(0.87);
    }

    .ground {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;

      height: 54px;

      background:
        repeating-linear-gradient(
          90deg,
          #548c42 0 16px,
          #649c4c 16px 32px
        );

      border-top:
        3px solid rgba(64, 119, 53, 0.55);
    }

    .player {
      position: absolute;
      bottom: 25px;
      left: 50%;
      z-index: 15;

      width: 100px;
      height: 105px;

      transform: translateX(-50%);

      pointer-events: none;
    }

    .player.hit {
      animation: playerHit 0.25s ease;
    }

    @keyframes playerHit {
      0% {
        filter: none;
      }

      50% {
        filter:
          drop-shadow(0 0 10px red)
          saturate(2);
        transform: translateX(5px);
      }

      100% {
        filter: none;
      }
    }

    .squirrel {
      position: absolute;
      right: 16px;
      bottom: 16px;

      font-size: 57px;
      line-height: 1;

      filter:
        drop-shadow(0 4px 2px rgba(0, 0, 0, 0.18));
    }

    .basket {
      position: absolute;
      bottom: 0;
      left: 2px;

      width: 96px;
      height: 37px;

      border: 4px solid #6b4028;
      border-radius: 8px 8px 24px 24px;

      background:
        repeating-linear-gradient(
          45deg,
          #bc794e 0 8px,
          #db9862 8px 16px
        );

      box-shadow:
        0 5px 7px rgba(75, 46, 27, 0.23);
    }

    .basket::before {
      content: "";

      position: absolute;
      top: -25px;
      left: 23px;

      width: 43px;
      height: 31px;

      border: 4px solid #6b4028;
      border-bottom: 0;
      border-radius: 28px 28px 0 0;
    }

    .falling-item {
      position: absolute;
      z-index: 10;

      display: flex;
      justify-content: center;
      align-items: center;

      width: 46px;
      height: 46px;

      pointer-events: none;
      will-change: top, transform;

      filter:
        drop-shadow(0 4px 3px rgba(0, 0, 0, 0.22));
    }

    .falling-item.acorn {
      animation:
        acornSpin 1.1s linear infinite;
    }

    .falling-item.chestnut {
      font-size: 38px;

      animation:
        chestnutWobble 0.45s ease-in-out
        infinite alternate;
    }

    .acorn-image {
      display: block;

      width: 43px;
      height: 43px;

      object-fit: contain;
      pointer-events: none;
    }

    @keyframes acornSpin {
      from {
        transform: rotate(-12deg);
      }

      to {
        transform: rotate(348deg);
      }
    }

    @keyframes chestnutWobble {
      from {
        transform: rotate(-14deg);
      }

      to {
        transform: rotate(14deg);
      }
    }

    .floating-score {
      position: absolute;
      z-index: 30;

      font-size: 1.3rem;
      font-weight: 900;

      pointer-events: none;

      animation:
        floatingScore 0.7s ease-out forwards;
    }

    .floating-score.plus {
      color: #247c32;
    }

    .floating-score.minus {
      color: #d83e3e;
    }

    @keyframes floatingScore {
      0% {
        opacity: 1;
        transform:
          translateY(0)
          scale(0.85);
      }

      100% {
        opacity: 0;
        transform:
          translateY(-58px)
          scale(1.25);
      }
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 50;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 25px;
      text-align: center;

      background:
        rgba(255, 252, 238, 0.91);

      backdrop-filter: blur(4px);
    }

    .screen.hidden {
      display: none;
    }

    .screen-icon {
      margin-bottom: 7px;
      font-size: 4rem;
      line-height: 1;
    }

    .screen h2 {
      margin: 5px 0 11px;
      font-size: 1.7rem;
    }

    .screen p {
      margin: 4px 0;
      line-height: 1.55;
    }

    .start-acorn {
      width: 78px;
      height: 78px;
      object-fit: contain;

      filter:
        drop-shadow(0 5px 4px rgba(0, 0, 0, 0.18));
    }

    .primary-button {
      min-width: 174px;
      margin-top: 17px;
      padding: 13px 22px;

      border: 0;
      border-radius: 999px;

      color: white;
      background: #4b873f;

      font-size: 1rem;
      font-weight: 900;

      box-shadow:
        0 7px 16px rgba(75, 135, 63, 0.28);

      cursor: pointer;
    }

    .primary-button:active {
      transform: scale(0.97);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;

      margin-top: 12px;
    }

    .control-button {
      min-height: 55px;

      border: 0;
      border-radius: 15px;

      color: white;
      background: #86583a;

      font-size: 1.6rem;
      font-weight: 900;

      box-shadow:
        0 5px 10px rgba(91, 53, 37, 0.22);

      cursor: pointer;
      touch-action: manipulation;
    }

    .control-button.active,
    .control-button:active {
      background: #68402d;
      transform: translateY(2px);

      box-shadow:
        0 2px 5px rgba(91, 53, 37, 0.25);
    }

    .instructions {
      margin: 10px 0 0;

      text-align: center;

      color: #796052;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    @media (max-width: 430px) {
      body {
        padding: 7px;
      }

      .game-container {
        padding: 11px;
        border-radius: 19px;
      }

      .description {
        font-size: 0.82rem;
      }

      .game-area {
        height: 59vh;
        min-height: 400px;
      }

      .difficulty-button {
        padding: 9px 4px;
      }

      .status-value {
        font-size: 0.87rem;
      }
    }
  </style>
</head>

<body>

  <main class="game-container">

    <h1>🐿️ 다람쥐의 도토리 대작전</h1>

    <p class="description">
      도토리를 바구니에 담아 50점을 만드세요.<br>
      밤을 받으면 점수가 1점 줄어들어요!
    </p>

    <div class="difficulty-title">
      난이도 선택
    </div>

    <section class="difficulty-buttons">

      <button
        type="button"
        class="difficulty-button"
        data-difficulty="easy"
      >
        하<br>
        <small>천천히</small>
      </button>

      <button
        type="button"
        class="difficulty-button selected"
        data-difficulty="normal"
      >
        중<br>
        <small>보통</small>
      </button>

      <button
        type="button"
        class="difficulty-button"
        data-difficulty="hard"
      >
        상<br>
        <small>빠르게</small>
      </button>

    </section>

    <section class="status-board">

      <div class="status-card">
        <span class="status-name">도토리 점수</span>
        <span
          class="status-value"
          id="scoreValue"
        >
          0 / 50
        </span>
      </div>

      <div class="status-card">
        <span class="status-name">난이도</span>
        <span
          class="status-value"
          id="difficultyValue"
        >
          중
        </span>
      </div>

      <div class="status-card">
        <span class="status-name">시간</span>
        <span
          class="status-value"
          id="timeValue"
        >
          0.0초
        </span>
      </div>

    </section>

    <div class="progress-header">
      <span>목표 달성도</span>
      <span id="progressText">0%</span>
    </div>

    <div class="progress-bar">
      <div
        class="progress-fill"
        id="progressFill"
      ></div>
    </div>

    <section
      class="game-area"
      id="gameArea"
    >

      <div class="sun"></div>

      <div class="tree tree-left"></div>
      <div class="tree tree-right"></div>

      <div class="ground"></div>

      <div
        class="player"
        id="player"
      >
        <div class="squirrel">🐿️</div>
        <div class="basket"></div>
      </div>

      <div
        class="screen"
        id="startScreen"
      >

        ./acorn.png

        <h2>도토리 50개 모으기</h2>

        <p>
          도토리 획득:
          <strong>+1점</strong>
        </p>

        <p>
          밤 획득:
          <strong>-1점</strong>
        </p>

        <p>
          바구니를 좌우로 움직여 주세요.
        </p>

        <button
          type="button"
          class="primary-button"
          id="startButton"
        >
          게임 시작
        </button>

      </div>

      <div
        class="screen hidden"
        id="resultScreen"
      >

        <div class="screen-icon">🎉🐿️🎉</div>

        <h2>도토리 50개 성공!</h2>

        <p id="resultMessage"></p>
        <p id="bestMessage"></p>

        <button
          type="button"
          class="primary-button"
          id="restartButton"
        >
          다시 도전하기
        </button>

      </div>

    </section>

    <section class="controls">

      <button
        type="button"
        class="control-button"
        id="leftButton"
      >
        ◀
      </button>

      <button
        type="button"
        class="control-button"
        id="rightButton"
      >
        ▶
      </button>

    </section>

    <p class="instructions">
      PC: ← → 또는 A/D 키<br>
      모바일: 좌우 버튼 또는 게임 화면 드래그
    </p>

  </main>

  <script>
    "use strict";

    const TARGET_SCORE = 50;

    const difficultySettings = {
      easy: {
        label: "하",
        minimumSpeed: 105,
        maximumSpeed: 145,
        spawnInterval: 880,
        chestnutChance: 0.2
      },

      normal: {
        label: "중",
        minimumSpeed: 165,
        maximumSpeed: 225,
        spawnInterval: 620,
        chestnutChance: 0.3
      },

      hard: {
        label: "상",
        minimumSpeed: 250,
        maximumSpeed: 345,
        spawnInterval: 420,
        chestnutChance: 0.38
      }
    };

    const gameArea =
      document.getElementById("gameArea");

    const player =
      document.getElementById("player");

    const scoreValue =
      document.getElementById("scoreValue");

    const difficultyValue =
      document.getElementById(
        "difficultyValue"
      );

    const timeValue =
      document.getElementById("timeValue");

    const progressText =
      document.getElementById("progressText");

    const progressFill =
      document.getElementById("progressFill");

    const startScreen =
      document.getElementById("startScreen");

    const resultScreen =
      document.getElementById("resultScreen");

    const resultMessage =
      document.getElementById(
        "resultMessage"
      );

    const bestMessage =
      document.getElementById("bestMessage");

    const startButton =
      document.getElementById("startButton");

    const restartButton =
      document.getElementById(
        "restartButton"
      );

    const leftButton =
      document.getElementById("leftButton");

    const rightButton =
      document.getElementById("rightButton");

    const difficultyButtons =
      document.querySelectorAll(
        ".difficulty-button"
      );

    let selectedDifficulty = "normal";

    let gameRunning = false;
    let score = 0;

    let playerX = 0;
    let movementDirection = 0;

    let startTime = 0;
    let elapsedTime = 0;
    let previousFrameTime = 0;
    let previousSpawnTime = 0;

    let animationFrameId = null;

    let fallingItems = [];

    let dragging = false;

    function updatePlayerPosition() {
      const maximumX =
        gameArea.clientWidth -
        player.offsetWidth;

      playerX = Math.max(
        0,
        Math.min(maximumX, playerX)
      );

      player.style.left = playerX + "px";
      player.style.transform = "none";
    }

    function centerPlayer() {
      playerX =
        (
          gameArea.clientWidth -
          player.offsetWidth
        ) / 2;

      updatePlayerPosition();
    }

    function updateStatus() {
      scoreValue.textContent =
        `${score} / ${TARGET_SCORE}`;

      difficultyValue.textContent =
        difficultySettings[
          selectedDifficulty
        ].label;

      timeValue.textContent =
        `${elapsedTime.toFixed(1)}초`;

      const progress =
        Math.min(
          100,
          Math.round(
            (score / TARGET_SCORE) * 100
          )
        );

      progressText.textContent =
        progress + "%";

      progressFill.style.width =
        progress + "%";
    }

    function removeAllItems() {
      fallingItems.forEach((item) => {
        item.element.remove();
      });

      fallingItems = [];
    }

    function resetGame() {
      gameRunning = false;
      score = 0;
      elapsedTime = 0;
      movementDirection = 0;

      previousFrameTime = 0;
      previousSpawnTime = 0;

      if (animationFrameId !== null) {
        cancelAnimationFrame(
          animationFrameId
        );
      }

      animationFrameId = null;

      removeAllItems();
      centerPlayer();
      updateStatus();
    }

    function startGame() {
      resetGame();

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");

      difficultyButtons.forEach(
        (button) => {
          button.disabled = true;
        }
      );

      gameRunning = true;

      startTime = performance.now();
      previousFrameTime = startTime;
      previousSpawnTime = startTime;

      animationFrameId =
        requestAnimationFrame(gameLoop);
    }

    function endGame() {
      gameRunning = false;
      movementDirection = 0;

      if (animationFrameId !== null) {
        cancelAnimationFrame(
          animationFrameId
        );
      }

      animationFrameId = null;

      removeAllItems();

      const storageKey =
        "acornGameBest_" +
        selectedDifficulty;

      const savedRecord =
        Number(
          localStorage.getItem(storageKey)
        );

      const newRecord =
        !savedRecord ||
        elapsedTime < savedRecord;

      if (newRecord) {
        localStorage.setItem(
          storageKey,
          elapsedTime.toString()
        );
      }

      const bestTime =
        newRecord
          ? elapsedTime
          : savedRecord;

      resultMessage.textContent =
        difficultySettings[
          selectedDifficulty
        ].label +
        " 난이도를 " +
        elapsedTime.toFixed(1) +
        "초 만에 성공했어요!";

      if (newRecord) {
        bestMessage.textContent =
          "🏆 새로운 최고 기록: " +
          elapsedTime.toFixed(1) +
          "초";
      } else {
        bestMessage.textContent =
          "최고 기록: " +
          bestTime.toFixed(1) +
          "초";
      }

      resultScreen.classList.remove(
        "hidden"
      );

      difficultyButtons.forEach(
        (button) => {
          button.disabled = false;
        }
      );
    }

    function createFallingItem() {
      const settings =
        difficultySettings[
          selectedDifficulty
        ];

      const isChestnut =
        Math.random() <
        settings.chestnutChance;

      const element =
        document.createElement("div");

      element.className =
        "falling-item " +
        (
          isChestnut
            ? "chestnut"
            : "acorn"
        );

      if (isChestnut) {
        element.textContent = "🌰";
      } else {
        const acornImage =
          document.createElement("img");

        acornImage.src = "./acorn.png";
        acornImage.alt = "도토리";
        acornImage.className =
          "acorn-image";

        element.appendChild(acornImage);
      }

      const itemSize = 46;

      const maximumX =
        gameArea.clientWidth -
        itemSize;

      const x =
        Math.random() * maximumX;

      const speed =
        settings.minimumSpeed +
        Math.random() *
        (
          settings.maximumSpeed -
          settings.minimumSpeed
        );

      element.style.left = x + "px";
      element.style.top = "-55px";

      gameArea.appendChild(element);

      fallingItems.push({
        element: element,
        kind:
          isChestnut
            ? "chestnut"
            : "acorn",
        x: x,
        y: -55,
        size: itemSize,
        speed: speed
      });
    }

    function overlaps(first, second) {
      return (
        first.left < second.right &&
        first.right > second.left &&
        first.top < second.bottom &&
        first.bottom > second.top
      );
    }

    function showScoreEffect(
      text,
      x,
      y,
      styleName
    ) {
      const effect =
        document.createElement("div");

      effect.className =
        "floating-score " + styleName;

      effect.textContent = text;
      effect.style.left = x + "px";
      effect.style.top = y + "px";

      gameArea.appendChild(effect);

      setTimeout(() => {
        effect.remove();
      }, 720);
    }

    function collectItem(item) {
      if (item.kind === "acorn") {
        score += 1;

        showScoreEffect(
          "+1",
          item.x,
          item.y,
          "plus"
        );
      } else {
        score = Math.max(0, score - 1);

        showScoreEffect(
          "-1",
          item.x,
          item.y,
          "minus"
        );

        player.classList.remove("hit");

        void player.offsetWidth;

        player.classList.add("hit");

        setTimeout(() => {
          player.classList.remove("hit");
        }, 260);
      }

      updateStatus();

      if (score >= TARGET_SCORE) {
        endGame();
      }
    }

    function movePlayer(deltaSeconds) {
      const playerSpeed = 350;

      playerX +=
        movementDirection *
        playerSpeed *
        deltaSeconds;

      updatePlayerPosition();
    }

    function moveFallingItems(
      deltaSeconds
    ) {
      const areaRectangle =
        gameArea.getBoundingClientRect();

      const playerRectangle =
        player.getBoundingClientRect();

      const basketRectangle = {
        left:
          playerRectangle.left + 2,

        right:
          playerRectangle.right - 2,

        top:
          playerRectangle.bottom - 44,

        bottom:
          playerRectangle.bottom - 3
      };

      for (
        let index =
          fallingItems.length - 1;

        index >= 0;

        index--
      ) {
        const item =
          fallingItems[index];

        item.y +=
          item.speed * deltaSeconds;

        item.element.style.top =
          item.y + "px";

        const itemRectangle = {
          left:
            areaRectangle.left +
            item.x +
            6,

          right:
            areaRectangle.left +
            item.x +
            item.size -
            6,

          top:
            areaRectangle.top +
            item.y +
            5,

          bottom:
            areaRectangle.top +
            item.y +
            item.size -
            4
        };

        if (
          overlaps(
            itemRectangle,
            basketRectangle
          )
        ) {
          item.element.remove();

          fallingItems.splice(
            index,
            1
          );

          collectItem(item);

          if (!gameRunning) {
            return;
          }

          continue;
        }

        if (
          item.y >
          gameArea.clientHeight + 60
        ) {
          item.element.remove();

          fallingItems.splice(
            index,
            1
          );
        }
      }
    }

    function gameLoop(currentTime) {
      if (!gameRunning) {
        return;
      }

      const elapsedSinceFrame =
        Math.min(
          34,
          currentTime -
          previousFrameTime
        );

      const deltaSeconds =
        elapsedSinceFrame / 1000;

      previousFrameTime = currentTime;

      elapsedTime =
        (currentTime - startTime) / 1000;

      const settings =
        difficultySettings[
          selectedDifficulty
        ];

      if (
        currentTime -
        previousSpawnTime >=
        settings.spawnInterval
      ) {
        createFallingItem();
        previousSpawnTime = currentTime;
      }

      movePlayer(deltaSeconds);
      moveFallingItems(deltaSeconds);
      updateStatus();

      if (gameRunning) {
        animationFrameId =
          requestAnimationFrame(
            gameLoop
          );
      }
    }

    function chooseDifficulty(
      difficulty
    ) {
      if (gameRunning) {
        return;
      }

      selectedDifficulty =
        difficulty;

      difficultyButtons.forEach(
        (button) => {
          button.classList.toggle(
            "selected",
            button.dataset.difficulty ===
              difficulty
          );
        }
      );

      updateStatus();
    }

    function startMoving(
      direction,
      button
    ) {
      movementDirection = direction;
      button.classList.add("active");
    }

    function stopMoving(button) {
      movementDirection = 0;
      button.classList.remove("active");
    }

    function addMovementButton(
      button,
      direction
    ) {
      button.addEventListener(
        "pointerdown",
        (event) => {
          event.preventDefault();

          button.setPointerCapture(
            event.pointerId
          );

          startMoving(
            direction,
            button
          );
        }
      );

      button.addEventListener(
        "pointerup",
        () => {
          stopMoving(button);
        }
      );

      button.addEventListener(
        "pointercancel",
        () => {
          stopMoving(button);
        }
      );

      button.addEventListener(
        "pointerleave",
        () => {
          stopMoving(button);
        }
      );
    }

    function movePlayerToPointer(event) {
      const areaRectangle =
        gameArea.getBoundingClientRect();

      const pointerX =
        event.clientX -
        areaRectangle.left;

      playerX =
        pointerX -
        player.offsetWidth / 2;

      updatePlayerPosition();
    }

    difficultyButtons.forEach(
      (button) => {
        button.addEventListener(
          "click",
          () => {
            chooseDifficulty(
              button.dataset.difficulty
            );
          }
        );
      }
    );

    startButton.addEventListener(
      "click",
      startGame
    );

    restartButton.addEventListener(
      "click",
      startGame
    );

    document.addEventListener(
      "keydown",
      (event) => {
        const key =
          event.key.toLowerCase();

        if (
          event.key === "ArrowLeft" ||
          key === "a"
        ) {
          event.preventDefault();
          movementDirection = -1;
        }

        if (
          event.key === "ArrowRight" ||
          key === "d"
        ) {
          event.preventDefault();
          movementDirection = 1;
        }

        if (
          event.key === " " &&
          !gameRunning
        ) {
          event.preventDefault();
          startGame();
        }
      }
    );

    document.addEventListener(
      "keyup",
      (event) => {
        const key =
          event.key.toLowerCase();

        if (
          event.key === "ArrowLeft" ||
          event.key === "ArrowRight" ||
          key === "a" ||
          key === "d"
        ) {
          movementDirection = 0;
        }
      }
    );

    addMovementButton(
      leftButton,
      -1
    );

    addMovementButton(
      rightButton,
      1
    );

    gameArea.addEventListener(
      "pointerdown",
      (event) => {
        if (!gameRunning) {
          return;
        }

        dragging = true;

        gameArea.setPointerCapture(
          event.pointerId
        );

        movePlayerToPointer(event);
      }
    );

    gameArea.addEventListener(
      "pointermove",
      (event) => {
        if (
          !gameRunning ||
          !dragging
        ) {
          return;
        }

        movePlayerToPointer(event);
      }
    );

    gameArea.addEventListener(
      "pointerup",
      () => {
        dragging = false;
      }
    );

    gameArea.addEventListener(
      "pointercancel",
      () => {
        dragging = false;
      }
    );

    window.addEventListener(
      "resize",
      updatePlayerPosition
    );

    resetGame();
  </script>

</body>
</html>
